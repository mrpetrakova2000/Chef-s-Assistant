version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: chef-redis
    ports:
      - "6379:6379"
    networks:
      - chef-network
    restart: unless-stopped

  backend:
    build: .
    container_name: chef-assistant-backend
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./cache:/app/cache
    networks:
      - chef-network
    restart: unless-stopped

  worker:
    build: .
    container_name: chef-assistant-worker
    command: python -m app.worker
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./cache:/app/cache
    networks:
      - chef-network
    restart: unless-stopped
    deploy:
      replicas: 2  # Можно несколько воркеров

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    container_name: chef-assistant-frontend
    ports:
      - "3000:3000"
    networks:
      - chef-network
    restart: unless-stopped

networks:
  chef-network:
    driver: bridge